# Crée une release GitHub pour chaque nouvelle version notée dans CHANGELOG.md.
# Une section « ## v1.9.3 — titre » ajoutée en haut du fichier → release v1.9.3 avec ses notes.
name: Releases

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier la dernière version du journal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          entete=$(grep -m1 '^## v' CHANGELOG.md)
          version=$(echo "$entete" | grep -o 'v[0-9][0-9.]*')
          titre=$(echo "$entete" | sed 's/^## //')
          if [ -z "$version" ]; then echo "Aucune version dans CHANGELOG.md"; exit 0; fi
          if gh release view "$version" >/dev/null 2>&1; then echo "$version existe déjà"; exit 0; fi
          awk -v e="$entete" '$0==e{f=1;next} /^## v/{f=0} f' CHANGELOG.md > notes.md
          gh release create "$version" --target "$GITHUB_SHA" --title "$titre" --notes-file notes.md
